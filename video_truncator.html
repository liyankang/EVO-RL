<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频轨迹截断工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .section {
            margin-bottom: 30px;
            padding: 20px;
            border-radius: 10px;
            background: #f8f9fa;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .file-info {
            margin-top: 10px;
            padding: 10px;
            background: #e3f2fd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .file-info.error {
            background: #ffebee;
            color: #c62828;
        }
        
        .file-info.success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .dataset-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .info-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .info-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .info-card p {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        
        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .episode-card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .episode-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .episode-card.selected {
            border-color: #667eea;
            background: #e8f2ff;
        }
        
        .episode-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .episode-number {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }
        
        .video-status {
            display: flex;
            gap: 8px;
        }
        
        .video-badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .video-badge.primary {
            background: #e3f2fd;
            color: #1976d2;
        }
        
        .video-badge.wrist {
            background: #fce4ec;
            color: #c2185b;
        }
        
        .video-badge.missing {
            background: #ffebee;
            color: #c62828;
        }
        
        .episode-details {
            font-size: 14px;
            color: #666;
        }
        
        .episode-details span {
            display: block;
            margin-bottom: 4px;
        }
        
        .video-container {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        
        video {
            width: 100%;
            display: block;
        }
        
        .controls {
            margin-top: 20px;
        }
        
        .slider-container {
            margin-bottom: 20px;
        }
        
        input[type="range"] {
            width: 100%;
            height: 10px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            background: #764ba2;
        }
        
        .frame-info {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
        
        .frame-info span {
            font-weight: 600;
            color: #333;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .progress-container {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }
        
        .progress-container.active {
            display: block;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
        }
        
        .progress-text {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
        
        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            white-space: pre-wrap;
        }
        
        .status-message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .preview-thumbnail {
            margin-top: 15px;
            text-align: center;
        }
        
        .preview-thumbnail img {
            max-width: 100%;
            border-radius: 8px;
            border: 3px solid #667eea;
        }
        
        .preview-label {
            margin-top: 8px;
            font-size: 14px;
            color: #666;
        }
        
        .camera-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .camera-option {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .camera-option:hover {
            border-color: #667eea;
        }
        
        .camera-option.selected {
            border-color: #667eea;
            background: #e8f2ff;
        }
        
        .hidden {
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .loading::after {
            content: '...';
            animation: dots 1.5s steps(5, end) infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 视频轨迹截断工具</h1>
        <p class="subtitle">选择数据集和Episode，截断轨迹和视频数据</p>
        
        <!-- 数据集路径选择 -->
        <div class="section">
            <div class="section-title">📁 数据集加载</div>
            
            <div class="input-group">
                <label for="datasetRoot">数据集根目录</label>
                <input type="text" id="datasetRoot" placeholder="例如: /media/Data/huggingface/lerobot/lerobot_v3/data_toiletButton_0713" value="/media/Data/huggingface/lerobot/lerobot_v3/data_toiletButton_0713">
                <div class="file-info" id="datasetInfo">请输入数据集根目录</div>
            </div>
            
            <button class="btn-primary" onclick="loadDataset()">加载数据集</button>
            
            <div id="datasetInfoPanel" class="hidden" style="margin-top: 20px;">
                <div class="dataset-info">
                    <div class="info-card">
                        <h3>总Episodes</h3>
                        <p id="totalEpisodes">-</p>
                    </div>
                    <div class="info-card">
                        <h3>总帧数</h3>
                        <p id="totalFrames">-</p>
                    </div>
                    <div class="info-card">
                        <h3>帧率</h3>
                        <p id="fps">-</p>
                    </div>
                    <div class="info-card">
                        <h3>机器人类型</h3>
                        <p id="robotType">-</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Episode选择 -->
        <div id="episodeSection" class="section hidden">
            <div class="section-title">🎯 Episode选择</div>
            
            <div class="input-group">
                <label>选择要截断的Episode</label>
                <div id="episodeGrid" class="episode-grid">
                    <div class="loading">加载中</div>
                </div>
            </div>
            
            <div id="selectedEpisodeInfo" class="hidden" style="margin-top: 15px;">
                <h3>已选择: Episode <span id="selectedEpisodeNumber">-</span></h3>
                <p>长度: <span id="selectedEpisodeLength">-</span> 帧</p>
            </div>
        </div>
        
        <!-- 视频预览和控制 -->
        <div id="videoSection" class="section hidden">
            <div class="section-title">🎥 视频预览和截断选择</div>
            
            <div class="camera-selector">
                <div class="camera-option selected" id="primaryCamera" onclick="selectCamera('primary')">
                    📷 Primary Camera
                </div>
                <div class="camera-option" id="wristCamera" onclick="selectCamera('wrist')">
                    ⌚ Wrist Camera
                </div>
            </div>
            
            <div class="video-container">
                <video id="videoPlayer" controls>
                    <source src="" type="video/mp4">
                    您的浏览器不支持视频播放
                </video>
            </div>
            
            <div class="controls">
                <div class="slider-container">
                    <label for="frameSlider">截断帧选择: <span id="frameNumber">0</span> 帧</label>
                    <input type="range" id="frameSlider" min="0" max="100" value="50">
                    <div class="frame-info">
                        <span>起始帧: 0</span>
                        <span>总帧数: <span id="totalFrames">100</span></span>
                        <span>时间: <span id="timeStamp">0.00s</span></span>
                    </div>
                </div>
                
                <div class="preview-thumbnail" id="previewThumbnail" style="display: none;">
                    <img id="thumbnailImage" src="" alt="截断帧预览">
                    <div class="preview-label">截断位置预览</div>
                </div>
                
                <div class="buttons">
                    <button class="btn-secondary" onclick="previewFrame()">📸 预览当前帧</button>
                    <button class="btn-success" onclick="truncateVideo()">✂️ 执行截断</button>
                </div>
            </div>
        </div>
        
        <!-- 进度显示 -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">准备中...</div>
        </div>
        
        <!-- 状态消息 -->
        <div class="status-message" id="statusMessage"></div>
    </div>

    <script>
        let datasetLoaded = false;
        let selectedEpisode = null;
        let selectedCamera = 'primary';
        let videoLoaded = false;
        let totalFrames = 0;
        let fps = 30;
        let datasetEpisodes = [];
        let currentVideoPath = '';
        
        const videoPlayer = document.getElementById('videoPlayer');
        const frameSlider = document.getElementById('frameSlider');
        const frameNumberDisplay = document.getElementById('frameNumber');
        const totalFramesDisplay = document.getElementById('totalFrames');
        const timeStampDisplay = document.getElementById('timeStamp');
        
        // 加载数据集
        async function loadDataset() {
            const datasetRoot = document.getElementById('datasetRoot').value;
            
            if (!datasetRoot) {
                showStatus('error', '请输入数据集根目录');
                return;
            }
            
            updateDatasetInfo('success', '正在加载数据集...');
            
            try {
                const response = await fetch('/load_dataset', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ dataset_root: datasetRoot })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    datasetLoaded = true;
                    datasetEpisodes = data.episodes;
                    
                    // 显示数据集信息
                    document.getElementById('datasetInfoPanel').classList.remove('hidden');
                    document.getElementById('totalEpisodes').textContent = data.dataset_info.total_episodes;
                    document.getElementById('totalFrames').textContent = data.dataset_info.total_frames;
                    document.getElementById('fps').textContent = data.dataset_info.fps;
                    document.getElementById('robotType').textContent = data.dataset_info.robot_type;
                    fps = data.dataset_info.fps;
                    
                    // 显示Episode列表
                    displayEpisodes(data.episodes);
                    
                    // 显示Episode选择区域
                    document.getElementById('episodeSection').classList.remove('hidden');
                    
                    updateDatasetInfo('success', `数据集加载成功！包含 ${data.episodes.length} 个episodes`);
                } else {
                    updateDatasetInfo('error', `加载失败: ${data.error}`);
                    if (data.details) {
                        showStatus('error', data.details.join('\n'));
                    }
                }
            } catch (error) {
                updateDatasetInfo('error', `请求失败: ${error.message}`);
            }
        }
        
        // 显示Episodes列表
        function displayEpisodes(episodes) {
            const grid = document.getElementById('episodeGrid');
            grid.innerHTML = '';
            
            episodes.forEach(episode => {
                const card = document.createElement('div');
                card.className = 'episode-card';
                card.onclick = () => selectEpisode(episode);
                
                const primaryStatus = episode.primary_video_exists ? 
                    '<span class="video-badge primary">✓ Primary</span>' : 
                    '<span class="video-badge missing">✗ Primary</span>';
                
                const wristStatus = episode.wrist_video_exists ? 
                    '<span class="video-badge wrist">✓ Wrist</span>' : 
                    '<span class="video-badge missing">✗ Wrist</span>';
                
                card.innerHTML = `
                    <div class="episode-header">
                        <span class="episode-number">Episode ${episode.episode_index}</span>
                        <div class="video-status">
                            ${primaryStatus}
                            ${wristStatus}
                        </div>
                    </div>
                    <div class="episode-details">
                        <span>📊 长度: ${episode.length} 帧</span>
                        <span>⏱️ 时长: ${(episode.length / fps).toFixed(2)}s</span>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }
        
        // 选择Episode
        function selectEpisode(episode) {
            selectedEpisode = episode;
            
            // 更新UI
            document.querySelectorAll('.episode-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            event.currentTarget.classList.add('selected');
            
            // 显示选中信息
            document.getElementById('selectedEpisodeInfo').classList.remove('hidden');
            document.getElementById('selectedEpisodeNumber').textContent = episode.episode_index;
            document.getElementById('selectedEpisodeLength').textContent = episode.length;
            
            // 显示视频区域
            document.getElementById('videoSection').classList.remove('hidden');
            
            // 加载默认相机视频
            loadVideoForEpisode(episode);
        }
        
        // 选择相机
        function selectCamera(camera) {
            selectedCamera = camera;
            
            // 更新UI
            document.querySelectorAll('.camera-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            
            document.getElementById(camera + 'Camera').classList.add('selected');
            
            // 重新加载视频
            if (selectedEpisode) {
                loadVideoForEpisode(selectedEpisode);
            }
        }
        
        // 为Episode加载视频
        function loadVideoForEpisode(episode) {
            let videoPath;
            
            if (selectedCamera === 'primary') {
                videoPath = episode.primary_video_path;
            } else {
                videoPath = episode.wrist_video_path;
            }
            
            if (!videoPath) {
                showStatus('error', `Episode ${episode.episode_index} 没有${selectedCamera}相机视频`);
                return;
            }
            
            currentVideoPath = videoPath;
            // 使用服务器路由访问视频文件
            videoPlayer.src = '/video/' + videoPath;
            totalFrames = episode.length;
            
            // 更新滑块
            frameSlider.max = totalFrames;
            frameSlider.value = Math.floor(totalFrames / 2);
            totalFramesDisplay.textContent = totalFrames;
            
            updateFrameDisplay(frameSlider.value);
            showStatus('success', `已加载 Episode ${episode.episode_index} 的${selectedCamera}相机视频`);
        }
        
        // 滑块变化
        frameSlider.addEventListener('input', function() {
            updateFrameDisplay(this.value);
        });
        
        // 视频元数据加载完成
        videoPlayer.addEventListener('loadedmetadata', function() {
            videoLoaded = true;
            updateFrameDisplay(frameSlider.value);
        });
        
        // 视频加载错误
        videoPlayer.addEventListener('error', function() {
            videoLoaded = false;
            showStatus('error', '视频加载失败，请检查路径是否正确');
        });
        
        function updateFrameDisplay(frame) {
            frameNumberDisplay.textContent = frame;
            const time = frame / fps;
            timeStampDisplay.textContent = time.toFixed(2) + 's';
            videoPlayer.currentTime = time;
        }
        
        function updateDatasetInfo(type, message) {
            const infoDiv = document.getElementById('datasetInfo');
            infoDiv.className = 'file-info ' + type;
            infoDiv.textContent = message;
        }
        
        function previewFrame() {
            if (!videoLoaded) {
                showStatus('error', '请先加载视频');
                return;
            }
            
            const canvas = document.createElement('canvas');
            canvas.width = videoPlayer.videoWidth;
            canvas.height = videoPlayer.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoPlayer, 0, 0, canvas.width, canvas.height);
            
            const thumbnailImage = document.getElementById('thumbnailImage');
            thumbnailImage.src = canvas.toDataURL('image/jpeg');
            document.getElementById('previewThumbnail').style.display = 'block';
            
            showStatus('success', `已预览第 ${frameSlider.value} 帧`);
        }
        
        function truncateVideo() {
            if (!selectedEpisode) {
                showStatus('error', '请先选择Episode');
                return;
            }
            
            const datasetRoot = document.getElementById('datasetRoot').value;
            const truncateFrame = parseInt(frameSlider.value);
            
            if (!datasetRoot) {
                showStatus('error', '请输入数据集根目录');
                return;
            }
            
            if (!videoLoaded) {
                showStatus('error', '请先加载视频');
                return;
            }
            
            // 发送截断请求到Python后端
            const requestData = {
                dataset_root: datasetRoot,
                episode_index: selectedEpisode.episode_index,
                truncate_frame: truncateFrame
            };
            
            showProgress('正在启动截断处理...');
            
            fetch('/truncate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(requestData)
            })
            .then(response => response.json())
            .then(data => {
                hideProgress();
                if (data.success) {
                    let message = `✂️ 截断成功！\n`;
                    message += `📊 Episode ${data.episode_number}: 保留前 ${data.trajectory_frames} 帧\n`;
                    message += `🎬 处理视频: ${data.successful_videos_count} 成功`;
                    if (data.failed_videos_count > 0) {
                        message += `, ${data.failed_videos_count} 失败`;
                    }
                    message += `\n💾 备份位置: ${data.backup_dir}`;
                    
                    if (data.processed_videos) {
                        message += `\n\n📹 视频处理详情:\n`;
                        for (const [camera, info] of Object.entries(data.processed_videos)) {
                            if (info.error) {
                                message += `❌ ${camera}: ${info.error}\n`;
                            } else {
                                message += `✅ ${camera}: ${info.original_frames} -> ${info.truncated_frames} 帧\n`;
                            }
                        }
                    }
                    
                    showStatus('success', message);
                    
                    // 重新加载数据集以更新信息
                    setTimeout(() => loadDataset(), 1000);
                } else {
                    showStatus('error', `❌ 截断失败: ${data.error}`);
                }
            })
            .catch(error => {
                hideProgress();
                showStatus('error', `❌ 请求失败: ${error.message}`);
            });
        }
        
        function showStatus(type, message) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.className = 'status-message ' + type;
            statusDiv.textContent = message;
            
            if (type === 'success') {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 10000);
            }
        }
        
        function showProgress(text) {
            const progressContainer = document.getElementById('progressContainer');
            const progressText = document.getElementById('progressText');
            progressContainer.classList.add('active');
            progressText.textContent = text;
            document.getElementById('progressFill').style.width = '0%';
            
            // 开始轮询状态
            pollStatus();
        }
        
        function hideProgress() {
            const progressContainer = document.getElementById('progressContainer');
            progressContainer.classList.remove('active');
        }
        
        function pollStatus() {
            const progressContainer = document.getElementById('progressContainer');
            if (!progressContainer.classList.contains('active')) {
                return;
            }
            
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    if (data.is_processing) {
                        document.getElementById('progressFill').style.width = data.progress + '%';
                        document.getElementById('progressText').textContent = data.message;
                        
                        if (data.error) {
                            hideProgress();
                            showStatus('error', `处理出错: ${data.error}`);
                        } else {
                            setTimeout(pollStatus, 500);
                        }
                    }
                })
                .catch(error => {
                    console.error('状态查询失败:', error);
                });
        }
    </script>
</body>
</html>
